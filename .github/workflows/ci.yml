name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # The shim runs `uv run --frozen`, so a lockfile that drifted from pyproject.toml
      # fails every user's first run. Catch it here instead.
      - name: Lockfile is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format (ruff format)
        run: uv run ruff format --check .

      # The release workflow publishes this build to PyPI; catch metadata rot on every push.
      - name: Build and check distribution metadata
        run: uv build && uvx twine check --strict dist/*

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan tracked files for credentials
        run: python3 scripts/scan_secrets.py
